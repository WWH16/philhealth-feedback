{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PhilHealth Cauayan City{% endblock %}</title>
  <script>
    (function () {
      var t = localStorage.getItem('ph-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  {% block styles %}{% endblock %}
</head>
<body>
  {% block nav %}
    {% include 'components/navbar.html' %}
  {% endblock %}

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
